#!/usr/sbin/nft -f
# ExitGuard: Tailscale exit node 포워딩 트래픽 차단 테이블
# - blocked4/6   : 차단된 외부 목적지 (timeout 자동 만료)
# - quarantine4/6: 격리된 tailnet 클라이언트 (모든 포워딩 차단)
# - clients4     : 클라이언트별 실시간 패킷/바이트 카운터

table inet exitguard
delete table inet exitguard

table inet exitguard {
    set blocked4 {
        type ipv4_addr
        flags timeout
        comment "blocked external destinations"
    }
    set blocked6 {
        type ipv6_addr
        flags timeout
    }
    set quarantine4 {
        type ipv4_addr
        flags timeout
        comment "quarantined tailnet clients"
    }
    set quarantine6 {
        type ipv6_addr
        flags timeout
    }
    set clients4 {
        type ipv4_addr
        flags dynamic,timeout
        size 4096
        counter
    }
    set clients6 {
        type ipv6_addr
        flags dynamic,timeout
        size 4096
        counter
    }

    chain forward {
        type filter hook forward priority -10; policy accept;

        # 클라이언트별 사용량 카운터 (2시간 비활성 시 만료)
        iifname "tailscale0" update @clients4 { ip saddr timeout 2h }
        iifname "tailscale0" update @clients6 { ip6 saddr timeout 2h }

        # 격리된 클라이언트: 모든 포워딩 거부
        iifname "tailscale0" ip saddr @quarantine4 counter reject with icmp type admin-prohibited comment "quarantined client"
        iifname "tailscale0" ip6 saddr @quarantine6 counter reject with icmpv6 type admin-prohibited

        # 공인 IPv6 업링크가 없는 환경 기준: 외부행 IPv6 를 즉시 거부해 클라이언트가 바로 IPv4 로 폴백하게 함
        # (그냥 두면 응답 없이 사라져 Happy Eyeballs 대기 발생. IPv6 업링크가 생기면 이 줄 삭제)
        iifname "tailscale0" ip6 daddr != fd7a:115c:a1e0::/48 counter reject with icmpv6 type no-route comment "no IPv6 uplink"

        # 차단된 목적지: 나가는 건 reject, 들어오는 건 drop
        iifname "tailscale0" ip daddr @blocked4 counter reject with icmp type admin-prohibited comment "blocked destination"
        iifname "tailscale0" ip6 daddr @blocked6 counter reject with icmpv6 type admin-prohibited
        oifname "tailscale0" ip saddr @blocked4 counter drop
        oifname "tailscale0" ip6 saddr @blocked6 counter drop
    }
}
