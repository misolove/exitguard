name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    # ubuntu-latest(26.04)에는 Python 3.9 가 없다. 필수 검사 이름은 그대로 두고 3.9 만 24.04 에서 돌린다
    runs-on: ${{ matrix.python == '3.9' && matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # 외부 패키지 설치 없음: 표준 라이브러리만으로 데모 모드 테스트 (Suricata/nftables/root 불필요)
      - name: Syntax check
        run: python -m py_compile exitguard/*.py tests/*.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
